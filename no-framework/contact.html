<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — FiveFileSite</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">FiveFileSite</a>
      <button id="nav-toggle-3" class="nav-toggle" aria-expanded="false" aria-controls="site-nav-3">☰</button>
      <nav id="site-nav-3" class="site-nav" role="navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <article class="content">
      <h1>Contact Us</h1>
      <p>If you want to test the contact form locally, it uses client-side validation and shows a success message — it does not send emails (no backend required).</p>

      <form id="contact-form" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required minlength="2" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required minlength="10"></textarea>

        <div class="form-actions">
          <button type="submit" class="btn">Send</button>
          <button type="reset" class="btn secondary">Reset</button>
        </div>

        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year-3"></span> FiveFileSite</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
